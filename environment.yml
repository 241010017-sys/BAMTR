# Tested reference versions; choose a CUDA PyTorch build separately for GPU use.
name: bamtr
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.3.0
      - numpy==1.26.4
      - pandas==2.2.2
      - PyYAML==6.0.1
      - matplotlib==3.9.2
      - pytest>=8,<9
      - -e .
