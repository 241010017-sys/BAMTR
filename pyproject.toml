[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamtr"
version = "0.1.0"
description = "Behavior-aware trajectory recovery with adaptive personal historical priors"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bamtr = "bamtr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
