name: CPU tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m bamtr prepare --config configs/smoke.yaml
      - run: python -m bamtr train --config configs/smoke.yaml
      - run: python -m bamtr evaluate --checkpoint runs/smoke/best.pt --split test --output-dir runs/smoke/test
